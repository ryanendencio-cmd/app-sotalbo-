name: buildtrack
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.12.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^8.2.1
  http: ^1.6.0
  device_preview: ^1.3.1
  shared_preferences: 2.2.3
  firebase_core: ^3.10.1
  firebase_auth: ^5.5.0

  intl: any
  image_picker: ^1.2.4
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  mobile_scanner: ^7.5.0
  nfc_manager: ^4.3.0
dependency_overrides:
  shared_preferences_android: 2.2.3
  path_provider_android: 2.2.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/